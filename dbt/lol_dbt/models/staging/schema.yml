version: 2

models:
  - name: game_mode
    description: "Game mode"
    columns:
      - name: match_id
        description: "Unique match identifier"
        tests:
          - unique
          - not_null
      - name: game_duration_mins
        description: "Match duration in minutes"
        tests:
          - not_null
      - name: game_mode
        description: "Game mode"
        tests:
          - accepted_values:
              values: ['ARAM']

  - name: stg_participants
    description: "One record per player per match. Includes calculated KDA, damage, gold and item stats."
    columns:
      - name: id
        description: "Unique record identifier"
        tests:
          - unique
          - not_null
      - name: match_id
        description: "Reference to the match"
        tests:
          - not_null
      - name: champion_name
        description: "Name of the champion played"
        tests:
          - not_null
      - name: kills
        description: "Player kills in the match"
        tests:
          - not_null
      - name: deaths
        description: "Player deaths in the match"
        tests:
          - not_null
      - name: win
        description: "Whether the player won the match"
        tests:
          - not_null

  - name: stg_teams
    description: "One record per team per match. Includes kills, towers and inhibitors."
    columns:
      - name: id
        description: "Unique record identifier"
        tests:
          - unique
          - not_null
      - name: team_side
        description: "Team side on the mapa"
        tests:
          - accepted_values:
              values: ['Blue', 'Red']
      - name: win
        description: "Whether the team won the match"
        tests:
          - not_null