version: 2

models:
  - name: champion_stats
    description: "Aggregated stats per champion across all matches. Includes win rate, avg KDA, damage and gold."
    columns:
      - name: champion_name
        description: "Champion name"
        tests:
          - unique
          - not_null

      - name: win_rate
        description: "Ratio of wins over total games played"
        tests:
          - not_null

      - name: total_games
        description: "Total games played with the champion"
        tests:
          - not_null

  - name: match_summary
    description: "One row per match with duration, winning side and stats for both teams."
    columns:
      - name: match_id
        description: "Unique match identifier"
        tests:
          - unique
          - not_null

  - name: player_stats
    description: "Aggregated stats per player. Includes win rate, avg KDA and unique champions played."
    columns:
      - name: riot_id_game_name
        description: "Player summoner name"
        tests:
          - not_null