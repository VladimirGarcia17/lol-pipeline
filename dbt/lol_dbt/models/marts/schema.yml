version: 2

models:
  - name: champion_stats
    description: "Estadísticas agregadas por campeón across todas las partidas. Incluye winrate, KDA promedio, daño y oro."
    columns:
      - name: champion_name
        description: "Nombre del campeón"
        tests:
          - unique
          - not_null

      - name: win_rate
        description: "Proporción de victorias sobre total de partidas"
        tests:
          - not_null

      - name: total_games
        description: "Total de partidas jugadas con el campeón"
        tests:
          - not_null

  - name: match_summary
    description: "Resumen por partida con duración, lado ganador y estadísticas de ambos equipos."
    columns:
      - name: match_id
        description: "Identificador único de la partida"
        tests:
          - unique
          - not_null

  - name: player_stats
    description: "Estadísticas agregadas por jugador. Incluye winrate, KDA promedio y campeones únicos jugados."
    columns:
      - name: riot_id_game_name
        description: "Nombre del invocador"
        tests:
          - not_null